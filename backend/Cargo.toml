[package]
name = "wind_turbine_blade_monitor"
version = "1.0.0"
edition = "2021"
description = "大型风力发电机组叶片状态监测与修复决策系统后端"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
influxdb = "0.7"
reqwest = { version = "0.11", features = ["json"] }
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.10"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"
linfa = "0.7"
linfa-trees = "0.7"
linfa-datasets = "0.7"
ndarray = "0.15"
ndarray-rand = "0.14"
csv = "1.3"
cors = "0.1"
tower-http = { version = "0.5", features = ["cors"] }
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "4", features = ["axum"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
