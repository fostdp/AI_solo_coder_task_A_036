[random_forest]
n_trees = 50
max_depth = 10

[random_forest.feature_ranges]
amplitude = [60.0, 100.0]
duration = [100.0, 5000.0]
frequency_peak = [50.0, 400.0]
frequency_center = [50.0, 300.0]
energy = [100.0, 50000.0]
counts = [10.0, 200.0]

[random_forest.class_priors]
none = 0.4
matrix_cracking = 0.25
fiber_breakage = 0.2
delamination = 0.15

[random_forest.rule_weights]
delamination_amp_threshold = 95.0
delamination_dur_threshold = 2000.0
delamination_bonus = 0.2
fiber_amp_threshold = 85.0
fiber_freq_threshold = 250.0
fiber_bonus = 0.15
matrix_freq_low = 150.0
matrix_freq_high = 250.0
matrix_bonus = 0.1
low_amp_threshold = 70.0
low_amp_multiplier = 0.5
severity_matrix_weight = 0.3
severity_fiber_weight = 0.5
severity_delamination_weight = 0.8

[signal_processing]
wavelet_level = 2
threshold_method = "Universal"
default_wind_speed = 8.0
default_rotor_speed = 12.0

[strain_interpolation]
grid_resolution = 32
variogram_model = "Spherical"
blade_length = 20.0
blade_chord = 2.5

[alarm]
delamination_rate_threshold = 5.0
frequency_offset_threshold = 10.0
baseline_rotor_speed = 12.0
valid_speed_range = [9.0, 15.0]
valid_wind_range = [3.0, 25.0]
frequency_history_size = 10
trend_min_points = 3
trend_window_size = 5
cooldown_minutes = 30

[mes]
api_url = "http://mes.example.com/api/alerts"
api_token = "default_token"
enabled = true

[channels]
strain_buffer_size = 1000
ae_buffer_size = 1000
damage_buffer_size = 500
alarm_buffer_size = 100
